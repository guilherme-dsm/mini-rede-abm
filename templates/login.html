{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="auth-container">
<div class="auth-card">
    <h1 class="titulo-display">Bem-vindo de volta 👋</h1>
    <p class="auth-subtitle">Entra pra ver as novidades da ABM</p>
    <form method="POST" action="/login" class="form" id="form-login">
        <label>Email</label>
        <input type="email" id="input-email-login" name="email" class="input-organico" required>

        <label>Senha</label>
        <input type="password" id="input-senha-login" name="senha" class="input-organico" required>

        <button type="submit" class="btn btn-primary btn-block">Entrar</button>
    </form>
    <p class="auth-switch">Ainda não tem conta? <a href="{{ url_for('auth.cadastro') }}">Cadastre-se</a></p>
    <p class="auth-switch"><a href="{{ url_for('auth.esqueci_senha') }}">Esqueci minha senha</a></p>
</div>
</div>
<script src="{{ url_for('static', filename='js/login.js') }}"></script>
{% endblock %}
